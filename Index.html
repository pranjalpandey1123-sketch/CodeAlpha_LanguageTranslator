<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeAlpha Language Translator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌐 Language Translator</h1>

        <p class="subtitle">
            Translate your text into different languages
        </p>

        <div class="language-box">

            <div>
                <label>From</label>
                <select id="source">
                    <option value="en">English</option>
                    <option value="hi">Hindi</option>
                    <option value="gu">Gujarati</option>
                    <option value="mr">Marathi</option>
                    <option value="fr">French</option>
                    <option value="es">Spanish</option>
                    <option value="de">German</option>
                    <option value="ja">Japanese</option>
                </select>
            </div>

            <div>
                <label>To</label>
                <select id="target">
                    <option value="hi">Hindi</option>
                    <option value="en">English</option>
                    <option value="gu">Gujarati</option>
                    <option value="mr">Marathi</option>
                    <option value="fr">French</option>
                    <option value="es">Spanish</option>
                    <option value="de">German</option>
                    <option value="ja">Japanese</option>
                </select>
            </div>

        </div>

        <button id="swapBtn">⇄ Swap Languages</button>

        <label for="inputText">Enter Your Text</label>

        <textarea
            id="inputText"
            placeholder="Type your text here..."
        ></textarea>

        <button id="translateBtn">Translate Now</button>

        <label>Translated Result</label>

        <div id="result">
            Your translation will appear here...
        </div>

        <button id="copyBtn">📋 Copy Translation</button>

        <p id="status"></p>

        <div class="footer">
            Developed by CodeAlpha Intern
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
